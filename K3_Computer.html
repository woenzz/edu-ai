<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K3 Computer Adventure: Storybook & Desk Exam</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;600;800;900&family=Patrick+Hand&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --primary: #4F46E5;
      --primary-light: #EEF2FF;
      --secondary: #06B6D4;
      --accent-yellow: #FBBF24;
      --accent-green: #10B981;
      --accent-pink: #F43F5E;
      --accent-purple: #8B5CF6;
      --wood-dark: #3E2723;
      --wood-light: #5D4037;
      --paper-cream: #FFFDF9;
      --paper-line: #E2E8F0;
      --text-dark: #1E293B;
      --font-body: 'Nunito', sans-serif;
      --font-fun: 'Fredoka', cursive;
      --font-hand: 'Patrick Hand', cursive;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: var(--font-body);
      background: #0f172a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      color: var(--text-dark);
      overflow-x: hidden;
    }

    /* Top Navigation Bar */
    header {
      background: linear-gradient(135deg, #1e1b4b, #312e81);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: white;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      z-index: 50;
    }

    .brand-title {
      font-family: var(--font-fun);
      font-size: 24px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 12px;
      color: #FDE047;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    }

    .nav-tabs {
      display: flex;
      gap: 12px;
      background: rgba(255, 255, 255, 0.1);
      padding: 6px;
      border-radius: 999px;
    }

    .nav-btn {
      padding: 10px 22px;
      border-radius: 999px;
      border: none;
      font-family: var(--font-fun);
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      color: #E0E7FF;
      background: transparent;
    }

    .nav-btn.active {
      background: #F59E0B;
      color: #1E1B4B;
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.4);
      transform: translateY(-2px);
    }

    .header-tools {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .tool-btn {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: white;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 16px;
    }

    .tool-btn:hover {
      background: white;
      color: #1e1b4b;
      transform: scale(1.08);
    }

    /* Main Viewport Container */
    #main-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      position: relative;
    }

    /* ========================================================
       SECTION 1: 3D STORYBOOK WITH CHAPTER BOOKMARKS
       ======================================================== */
    #storybook-section {
      width: 100%;
      max-width: 1100px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .book-wrapper {
      perspective: 1800px;
      position: relative;
      width: 1000px;
      height: 620px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Bookmark Ribbon Tabs on Right Edge */
    .bookmark-tabs {
      position: absolute;
      right: -80px;
      top: 40px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 20;
    }

    .bookmark-tab {
      padding: 10px 18px 10px 22px;
      border-radius: 0 12px 12px 0;
      color: white;
      font-family: var(--font-fun);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 4px 4px 10px rgba(0,0,0,0.3);
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      gap: 8px;
      clip-path: polygon(0 0, 100% 0, 85% 50%, 100% 100%, 0 100%);
      width: 125px;
      position: relative;
    }

    .bookmark-tab:hover {
      transform: translateX(12px);
    }

    .bookmark-tab.active {
      transform: translateX(18px);
      filter: brightness(1.15);
      border-left: 5px solid #fff;
    }

    .tab-ch1 { background: #3B82F6; }
    .tab-ch2 { background: #10B981; }
    .tab-ch3 { background: #F59E0B; }
    .tab-ch4 { background: #8B5CF6; }
    .tab-ch5 { background: #EC4899; }
    .tab-ch6 { background: #06B6D4; }

    /* Realistic 3D Book Frame */
    .storybook {
      width: 950px;
      height: 600px;
      background: #fffdf5;
      border-radius: 20px 28px 28px 20px;
      box-shadow:
        0 25px 50px -12px rgba(0, 0, 0, 0.7),
        inset 0 0 20px rgba(0, 0, 0, 0.05),
        -15px 0 25px rgba(0,0,0,0.3);
      display: flex;
      position: relative;
      border: 8px solid #c2410c;
      overflow: hidden;
    }

    /* Central Book Spine */
    .book-spine {
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 36px;
      transform: translateX(-50%);
      background: linear-gradient(90deg,
        rgba(0,0,0,0.2) 0%,
        rgba(0,0,0,0.05) 30%,
        rgba(255,255,255,0.4) 50%,
        rgba(0,0,0,0.05) 70%,
        rgba(0,0,0,0.2) 100%);
      z-index: 10;
      pointer-events: none;
    }

    .page {
      flex: 1;
      height: 100%;
      padding: 36px 42px;
      position: relative;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      background: linear-gradient(to right, #FAF8F5, #FFFDF8);
    }

    .page.left-page {
      border-right: 1px solid rgba(0,0,0,0.08);
      padding-right: 48px;
    }

    .page.right-page {
      padding-left: 48px;
    }

    .page-turn-anim {
      animation: pageTurn 0.55s cubic-bezier(0.25, 1, 0.5, 1);
    }

    @keyframes pageTurn {
      0% { transform: rotateY(-18deg) scale(0.98); opacity: 0.6; filter: blur(1px); }
      100% { transform: rotateY(0deg) scale(1); opacity: 1; filter: blur(0); }
    }

    .chapter-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      background: #FEE2E2;
      color: #991B1B;
      border-radius: 999px;
      font-family: var(--font-fun);
      font-weight: 700;
      font-size: 14px;
      width: fit-content;
      margin-bottom: 10px;
    }

    .story-heading {
      font-family: var(--font-fun);
      font-size: 28px;
      color: #1E293B;
      line-height: 1.25;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .audio-read-btn {
      background: #EEF2FF;
      border: 2px solid #818CF8;
      color: #4F46E5;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .audio-read-btn:hover {
      background: #4F46E5;
      color: white;
      transform: scale(1.05);
    }

    .story-desc {
      font-size: 17px;
      line-height: 1.6;
      color: #334155;
      margin-bottom: 16px;
    }

    /* Graphic Cards & Illustrations */
    .character-card {
      background: white;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
      border: 2px dashed #CBD5E1;
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 14px;
    }

    .character-avatar {
      font-size: 48px;
      width: 70px;
      height: 70px;
      background: #EFF6FF;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .item-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 10px;
    }

    .item-card {
      background: white;
      border-radius: 14px;
      padding: 12px 14px;
      border: 2px solid #E2E8F0;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.2s;
    }

    .item-card:hover {
      border-color: #6366F1;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.15);
    }

    .item-icon {
      font-size: 28px;
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: #F1F5F9;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .item-title {
      font-family: var(--font-fun);
      font-size: 16px;
      font-weight: 700;
      color: #1E293B;
    }

    .item-sub {
      font-size: 13px;
      color: #64748B;
      font-weight: 600;
    }

    /* Chapter Mini Quiz on Right Page */
    .mini-quiz-box {
      background: #FFF;
      border-radius: 18px;
      padding: 20px;
      border: 2px solid #FCD34D;
      box-shadow: 0 6px 18px rgba(245, 158, 11, 0.15);
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .quiz-title {
      font-family: var(--font-fun);
      font-size: 20px;
      color: #B45309;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .quiz-question {
      font-size: 17px;
      font-weight: 700;
      color: #1F2937;
      margin-bottom: 14px;
      line-height: 1.4;
    }

    .choice-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }

    .choice-btn {
      background: #F8FAFC;
      border: 2px solid #E2E8F0;
      border-radius: 14px;
      padding: 12px 16px;
      font-size: 15px;
      font-weight: 700;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      color: #334155;
      transition: all 0.2s;
    }

    .choice-btn:hover {
      background: #EEF2FF;
      border-color: #818CF8;
      transform: translateX(4px);
    }

    .choice-btn.correct {
      background: #D1FAE5 !important;
      border-color: #10B981 !important;
      color: #065F46 !important;
    }

    .choice-btn.wrong {
      background: #FEE2E2 !important;
      border-color: #EF4444 !important;
      color: #991B1B !important;
    }

    .quiz-feedback {
      margin-top: 12px;
      padding: 10px 14px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 14px;
      display: none;
      align-items: center;
      gap: 8px;
    }

    .quiz-feedback.show {
      display: flex;
    }

    .quiz-feedback.success {
      background: #ECFDF5;
      color: #047857;
      border: 1px solid #A7F3D0;
    }

    .quiz-feedback.error {
      background: #FEF2F2;
      color: #B91C1C;
      border: 1px solid #FECACA;
    }

    /* Page Navigation Footer */
    .book-controls {
      display: flex;
      gap: 20px;
      margin-top: 24px;
      align-items: center;
    }

    .page-nav-btn {
      background: #F59E0B;
      color: #1E1B4B;
      border: none;
      padding: 12px 28px;
      border-radius: 999px;
      font-family: var(--font-fun);
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(245, 158, 11, 0.4);
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.2s;
    }

    .page-nav-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(245, 158, 11, 0.6);
      background: #FBBF24;
    }

    .page-nav-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .page-indicator {
      color: white;
      font-family: var(--font-fun);
      font-size: 18px;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.1);
      padding: 8px 20px;
      border-radius: 999px;
    }


    /* ========================================================
       SECTION 2: REALISTIC EXAM PAPER ON WOODEN DESK
       ======================================================== */
    #exam-section {
      width: 100%;
      max-width: 980px;
      display: none;
      flex-direction: column;
      align-items: center;
    }

    /* Wooden Desk Surface */
    .desk-surface {
      width: 100%;
      min-height: 720px;
      background:
        radial-gradient(ellipse at center, rgba(93, 64, 55, 0.8) 0%, rgba(62, 39, 35, 0.98) 100%),
        repeating-linear-gradient(45deg, rgba(0,0,0,0.05), rgba(0,0,0,0.05) 10px, transparent 10px, transparent 20px),
        #4A2E18;
      border-radius: 28px;
      box-shadow:
        0 30px 60px rgba(0, 0, 0, 0.8),
        inset 0 2px 10px rgba(255, 255, 255, 0.15),
        inset 0 -10px 20px rgba(0,0,0,0.6);
      padding: 40px 30px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 12px solid #271406;
    }

    /* Desk Accessories (Ruler, Pencil, Eraser) */
    .desk-pencil {
      position: absolute;
      top: 50px;
      right: 35px;
      width: 16px;
      height: 220px;
      background: #FBBF24;
      border-radius: 4px;
      transform: rotate(18deg);
      box-shadow: 4px 8px 15px rgba(0,0,0,0.4);
      border-top: 15px solid #F43F5E;
      border-bottom: 20px solid #E5E7EB;
    }
    .desk-pencil::after {
      content: '';
      position: absolute;
      bottom: -32px;
      left: 1px;
      width: 0;
      height: 0;
      border-left: 7px solid transparent;
      border-right: 7px solid transparent;
      border-top: 12px solid #1E293B;
    }

    .desk-eraser {
      position: absolute;
      bottom: 60px;
      left: 40px;
      width: 55px;
      height: 35px;
      background: #EC4899;
      border-radius: 6px;
      transform: rotate(-15deg);
      box-shadow: 3px 6px 12px rgba(0,0,0,0.4);
      border-right: 18px solid #3B82F6;
    }

    /* The Stapled Paper Packet */
    .paper-packet {
      width: 780px;
      min-height: 600px;
      position: relative;
      background: #FFFDF9;
      border-radius: 4px 16px 16px 4px;
      box-shadow:
        0 15px 35px rgba(0,0,0,0.4),
        0 0 0 1px rgba(0,0,0,0.05),
        5px 5px 0 #F8F6F0,
        10px 10px 0 #F1EFEA,
        15px 15px 15px rgba(0,0,0,0.3);
      padding: 45px 50px 40px 50px;
      display: flex;
      flex-direction: column;
      transition: transform 0.4s ease;
    }

    /* Metallic Staple at Top-Left */
    .staple-pin {
      position: absolute;
      top: 24px;
      left: 24px;
      width: 48px;
      height: 12px;
      background: linear-gradient(180deg, #E2E8F0 0%, #94A3B8 50%, #475569 100%);
      transform: rotate(-45deg);
      border-radius: 2px;
      box-shadow:
        0 3px 6px rgba(0,0,0,0.4),
        inset 0 1px 2px rgba(255,255,255,0.8);
      z-index: 30;
    }
    .staple-pin::before, .staple-pin::after {
      content: '';
      position: absolute;
      top: -3px;
      width: 2px;
      height: 18px;
      background: #334155;
    }
    .staple-pin::before { left: 4px; }
    .staple-pin::after { right: 4px; }

    /* Lined Paper Texture */
    .paper-header {
      border-bottom: 2px solid #DC2626;
      padding-bottom: 12px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .exam-title-box h2 {
      font-family: var(--font-hand);
      font-size: 32px;
      color: #1E3A8A;
      letter-spacing: 0.5px;
      font-weight: 700;
    }
    .exam-title-box p {
      font-family: var(--font-hand);
      font-size: 19px;
      color: #4B5563;
    }

    .student-badge-slot {
      font-family: var(--font-hand);
      font-size: 18px;
      color: #1F2937;
      text-align: right;
    }
    .student-badge-slot span {
      border-bottom: 1.5px dashed #4B5563;
      padding: 0 10px;
      color: #2563EB;
      font-weight: bold;
    }

    /* Paper Page Turn Effect */
    .paper-sheet-turn {
      animation: flipPaper 0.5s cubic-bezier(0.2, 0.8, 0.4, 1);
      transform-origin: 24px 24px;
    }

    @keyframes flipPaper {
      0% { transform: rotate(-8deg) translateY(-20px); opacity: 0.5; }
      100% { transform: rotate(0deg) translateY(0); opacity: 1; }
    }

    .exam-content {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .question-block {
      background: rgba(248, 250, 252, 0.7);
      border: 1px solid #E2E8F0;
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 16px;
    }

    .q-number {
      font-family: var(--font-fun);
      font-size: 16px;
      font-weight: 700;
      color: #4F46E5;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .q-text {
      font-size: 18px;
      font-weight: 700;
      color: #1E293B;
      margin-bottom: 14px;
      line-height: 1.4;
    }

    /* Exam Question Types */
    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .opt-label {
      background: white;
      border: 2px solid #CBD5E1;
      border-radius: 10px;
      padding: 10px 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 16px;
      font-weight: 600;
      color: #334155;
      transition: all 0.15s;
    }

    .opt-label:hover {
      border-color: #6366F1;
      background: #F5F3FF;
    }

    .opt-label input[type="radio"] {
      width: 18px;
      height: 18px;
      accent-color: #4F46E5;
      cursor: pointer;
    }

    /* Word Bank for Fill in Blank */
    .word-bank {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      background: #EEF2FF;
      border: 2px dashed #818CF8;
      border-radius: 12px;
      padding: 10px 14px;
      margin-bottom: 12px;
      align-items: center;
    }

    .word-bank-tag {
      font-family: var(--font-fun);
      font-size: 14px;
      font-weight: 700;
      color: #3730A3;
      margin-right: 6px;
    }

    .word-chip {
      background: white;
      border: 1.5px solid #6366F1;
      border-radius: 8px;
      padding: 4px 12px;
      font-size: 15px;
      font-weight: 700;
      color: #4F46E5;
      cursor: pointer;
      transition: all 0.2s;
    }

    .word-chip:hover {
      background: #4F46E5;
      color: white;
    }

    .fill-blank-sentence {
      font-size: 18px;
      line-height: 1.8;
      color: #1E293B;
    }

    .blank-slot {
      display: inline-block;
      min-width: 130px;
      height: 34px;
      border-bottom: 2.5px solid #2563EB;
      background: rgba(224, 231, 255, 0.4);
      border-radius: 4px;
      text-align: center;
      line-height: 34px;
      font-family: var(--font-fun);
      font-size: 16px;
      font-weight: 700;
      color: #1D4ED8;
      margin: 0 4px;
      vertical-align: middle;
      cursor: pointer;
    }

    /* Matching Interface */
    .match-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
      background: white;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #E2E8F0;
    }

    .match-left {
      font-weight: 700;
      font-size: 16px;
      color: #1E293B;
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .match-select {
      flex: 1;
      padding: 8px 12px;
      border-radius: 8px;
      border: 2px solid #94A3B8;
      font-family: var(--font-body);
      font-size: 15px;
      font-weight: 700;
      color: #1E293B;
      background: #F8FAFC;
      cursor: pointer;
    }

    .match-select:focus {
      outline: none;
      border-color: #4F46E5;
    }

    /* Story Reading Box */
    .reading-passage {
      background: #FFFBEB;
      border-left: 5px solid #F59E0B;
      padding: 14px 18px;

    /* ========================================================
       AUDIO SYNTHESIS SYSTEM (Web Audio API - No external files)
       ======================================================== */
    let audioCtx = null;
    let isSoundMuted = false;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function toggleMute() {
      isSoundMuted = !isSoundMuted;
      const icon = document.querySelector('#sound-toggle-btn i');
      if (isSoundMuted) {
        icon.className = 'fa-solid fa-volume-xmark';
      } else {
        icon.className = 'fa-solid fa-volume-high';
        playPageTurnSound();
      }
    }

    // Realistic paper flip rustle sound synthesizer
    function playPageTurnSound() {
      if (isSoundMuted) return;
      initAudio();
      try {
        const now = audioCtx.currentTime;
        const bufferSize = audioCtx.sampleRate * 0.18;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }

        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(1400, now);
        filter.frequency.exponentialRampToValueAtTime(350, now + 0.18);
        filter.Q.value = 1.8;

        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.18);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);

        noise.start(now);
      } catch (e) {
        console.warn("Audio synth:", e);
      }
    }

    function playDing(isSuccess = true) {
      if (isSoundMuted) return;
      initAudio();
      try {
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        if (isSuccess) {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(587.33, now); // D5
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.15); // A5
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        } else {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(260, now);
          osc.frequency.linearRampToValueAtTime(180, now + 0.25);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
        }

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.3);
      } catch (e) {}
    }

        utterance.rate = 0.9;
        utterance.pitch = 1.1;
        window.speechSynthesis.speak(utterance);
      }
    }

    function renderBookmarkRibbons() {
      const ribbonContainer = document.getElementById('bookmark-ribbons');
      ribbonContainer.innerHTML = '';
      storybookChapters.forEach((ch, idx) => {
        const btn = document.createElement('div');
        btn.className = `bookmark-tab ${ch.colorClass} ${idx === currentBookIndex ? 'active' : ''}`;
        btn.innerHTML = `<i class="fa-solid fa-bookmark"></i> ${ch.bookmark}`;
        btn.onclick = () => {
          if (currentBookIndex !== idx) {
            currentBookIndex = idx;
            renderStorybook();
          }
        };
        ribbonContainer.appendChild(btn);
      });
    }

      renderBookmarkRibbons();

      const ch = storybookChapters[currentBookIndex];
      const bookElement = document.getElementById('book-element');

      leftPage.innerHTML = `

    function checkChapterQuiz(btn, isCorrect, explanation) {
      const container = document.getElementById('chapter-quiz-choices');
      const feedback = document.getElementById('chapter-feedback');
      const allBtns = container.querySelectorAll('.choice-btn');

      allBtns.forEach(b => b.disabled = true);

      if (isCorrect) {
        btn.classList.add('correct');
        feedback.className = 'quiz-feedback show success';
        feedback.innerHTML = `<i class="fa-solid fa-circle-check"></i> Great job! ${explanation}`;
        playDing(true);
      } else {
        btn.classList.add('wrong');
        feedback.className = 'quiz-feedback show error';
        feedback.innerHTML = `<i class="fa-solid fa-circle-xmark"></i> Oops! Let's remember: ${explanation}`;

    function escapeSpeech(text) {
      return text.replace(/'/g, "\\'").replace(/"/g, '&quot;');

       DESK EXAM LOGIC (30 Questions across 6 Pages)
       ======================================================== */
    function renderExamPage() {
      playPageTurnSound();
      const pageData = examPagesData[currentExamPageIndex];
      const examBox = document.getElementById('exam-questions-box');
      const paperElement = document.getElementById('exam-sheet-paper');

      paperElement.classList.remove('paper-sheet-turn');
      void paperElement.offsetWidth;
      paperElement.classList.add('paper-sheet-turn');

      let html = `<div style="margin-bottom: 12px; font-family: var(--font-fun); color: #B45309; font-size: 16px;">
        <i class="fa-solid fa-paperclip"></i> Section: ${pageData.title}
      </div>`;

      pageData.questions.forEach((q) => {
        html += `<div class="question-block" id="exam-qblock-${q.id}">`;

        // Render based on type
        if (q.type === 'choice') {
          html += `
            <div class="q-number"><i class="fa-solid fa-circle-question"></i> Question ${q.id}</div>
            <div class="q-text">${q.q}</div>
            <div class="options-grid">
              ${q.options.map((opt, optIdx) => `
                <label class="opt-label">
                  <input type="radio" name="exam_q_${q.id}" value="${optIdx}"
                    ${userExamAnswers[q.id] === optIdx ? 'checked' : ''}
                    onchange="saveExamAnswer(${q.id},${optIdx})">
                  <span>${opt}</span>
                </label>
              `).join('')}
            </div>
          `;
        } else if (q.type === 'story_choice') {
          html += `
            <div class="q-number"><i class="fa-solid fa-book-bookmark"></i> Question ${q.id} (Story Reading)</div>
            <div class="reading-passage">${q.story}</div>
            <div class="q-text">${q.q}</div>
            <div class="options-grid">
              ${q.options.map((opt, optIdx) => `
                <label class="opt-label">
                  <input type="radio" name="exam_q_${q.id}" value="${optIdx}"
                    ${userExamAnswers[q.id] === optIdx ? 'checked' : ''}
                    onchange="saveExamAnswer(${q.id},${optIdx})">
                  <span>${opt}</span>
                </label>
              `).join('')}
            </div>
          `;
        } else if (q.type === 'matching') {
          html += `
            <div class="q-number"><i class="fa-solid fa-link"></i> Question ${q.id} (Matching)</div>
            <div class="q-text">${q.q}</div>
            <div>
              ${q.pairs.map((pair, pIdx) => {
                const currentVal = userExamAnswers[`${q.id}_${pIdx}`] || '';
                return `
                  <div class="match-row">
                    <span class="match-left">${pair.left}</span>
                    <select class="match-select" onchange="saveExamAnswer('${q.id}_${pIdx}', this.value)">
                      ${pair.options.map(opt => `
                        <option value="${opt}" ${currentVal === opt ? 'selected' : ''}>${opt}</option>
                      `).join('')}
                    </select>
                  </div>
                `;
              }).join('')}
            </div>
          `;
        } else if (q.type === 'fill') {
          const currentVal = userExamAnswers[q.id] || '_______';
          const parts = q.sentence.split('[BLANK]');
          html += `
            <div class="q-number"><i class="fa-solid fa-pen-fancy"></i> Question ${q.id} (Fill-in-the-Blank)</div>
            <div class="q-text">${q.q}</div>
            <div class="word-bank">
              <span class="word-bank-tag"><i class="fa-solid fa-box-archive"></i> Word Bank:</span>
              ${q.wordBank.map(w => `
                <button class="word-chip" onclick="fillWordAnswer(${q.id}, '${w}')">${w}</button>
              `).join('')}
            </div>
            <div class="fill-blank-sentence">
              ${parts[0]} <span class="blank-slot" id="blank-slot-${q.id}">${currentVal}</span> ${parts[1] || ''}
            </div>
          `;
        }

        html += `</div>`;
      });

      examBox.innerHTML = html;

      // Controls State
      document.getElementById('exam-page-indicator').textContent =
        `Exam Sheet ${currentExamPageIndex + 1} of ${examPagesData.length} (Questions ${currentExamPageIndex * 5 + 1} - ${currentExamPageIndex * 5 + 5})`;

      document.getElementById('exam-prev-btn').disabled = currentExamPageIndex === 0;

      if (currentExamPageIndex === examPagesData.length - 1) {
        document.getElementById('exam-next-btn').style.display = 'none';
        document.getElementById('exam-submit-btn').style.display = 'flex';
      } else {
        document.getElementById('exam-next-btn').style.display = 'flex';
        document.getElementById('exam-submit-btn').style.display = 'none';
      }
    }

    function saveExamAnswer(key, val) {
      userExamAnswers[key] = val;
      playDing(true);
    }

    function fillWordAnswer(qId, word) {
      userExamAnswers[qId] = word;
      const slot = document.getElementById(`blank-slot-${qId}`);
      if (slot) slot.textContent = word;
      playDing(true);
    }

    function flipExamPage(dir) {
      const nextIndex = currentExamPageIndex + dir;
      if (nextIndex >= 0 && nextIndex < examPagesData.length) {
        currentExamPageIndex = nextIndex;
        renderExamPage();
      }
    }

    /* ========================================================
       GRADING SYSTEM & SCORE MODAL
       ======================================================== */
    function gradeFullExam() {
      let score = 0;
      let totalQuestions = 30;

      examPagesData.forEach(page => {
        page.questions.forEach(q => {
          if (q.type === 'choice' || q.type === 'story_choice') {
            if (userExamAnswers[q.id] === q.answer) score++;
          } else if (q.type === 'fill') {
            if (userExamAnswers[q.id] === q.answer) score++;
          } else if (q.type === 'matching') {
            let allPairsCorrect = true;
            q.pairs.forEach((p, pIdx) => {
              if (userExamAnswers[`${q.id}_${pIdx}`] !== p.answer) {
                allPairsCorrect = false;
              }
            });
            if (allPairsCorrect) score++;
          }
        });
      });

      // Show Result Modal
      const modal = document.getElementById('score-modal');
      const scoreDisplay = document.getElementById('score-display');
      const scoreEmoji = document.getElementById('score-emoji');
      const scoreMsg = document.getElementById('score-feedback');

      scoreDisplay.textContent = `${score} / ${totalQuestions}`;

      if (score >= 26) {
        scoreEmoji.textContent = '🏆';
        scoreMsg.textContent = 'Outstanding Genius! You scored full honors on your computer exam!';
        playDing(true);
      } else if (score >= 20) {
        scoreEmoji.textContent = '🌟';
        scoreMsg.textContent = 'Fantastic Job! You understand computers really well!';
        playDing(true);
      } else {
        scoreEmoji.textContent = '🌱';
        scoreMsg.textContent = 'Good effort! Turn back through the Storybook and try again!';
        playDing(false);
      }

      modal.style.display = 'flex';
    }

    function closeScoreModal() {
      document.getElementById('score-modal').style.display = 'none';
    }

    function restartExam() {
      for (const k in userExamAnswers) delete userExamAnswers[k];
      currentExamPageIndex = 0;
      closeScoreModal();
      renderExamPage();
    }

    function showHelpModal() {
      alert("Tip for Kids & Teachers:\n\n1. Use 'Storybook' to read each lesson with cute characters and take randomized mini-quizzes!\n2. Click the 'Desk Exam' tab to open the 30-question stapled exam on the wooden desk.\n3. Flip through pages and click Submit at the end for instant grading!");
    }

    // Initialize application on load
    window.onload = () => {
      renderStorybook();
    };
  </script>
</body>
</html>
